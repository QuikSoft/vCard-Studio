<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jan Ziegler — Digital business card</title><style>:root{font-family:Inter,"Segoe UI",Arial,sans-serif;color:#171a27;background:#fff;font-synthesis:none;--yellow:#ffd100;--muted:#68758a;--border:#d6dde5}*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit;font-size:14px}button,a,input,textarea,select{-webkit-tap-highlight-color:transparent}button{cursor:pointer}button:disabled{cursor:default;opacity:.4}button:focus-visible,a:focus-visible{outline:3px solid #3764c9;outline-offset:4px}button{transition:background .15s,transform .15s}button:hover:not(:disabled){filter:brightness(.97)}a{color:inherit}svg{width:21px;height:21px;flex-shrink:0}.app-header{height:68px;padding:0 3.2%;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #e4e7eb}.brand{display:flex;align-items:center;gap:17px;text-decoration:none;font-size:22px;font-weight:750;letter-spacing:-.7px}.brand-mark{width:28px;height:28px;background:var(--yellow);border-radius:3px}.primary,.secondary{min-height:45px;padding:12px 24px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;gap:12px;font-weight:600;border:1px solid transparent}.primary{background:var(--yellow);color:#171a20}.secondary{background:white;border-color:var(--border);color:#202634}.workspace{display:grid;grid-template-columns:57% 43%;min-height:calc(100vh - 68px)}.editor{padding:44px 5.2vw 22px}h1{font-size:clamp(27px,2.65vw,40px);line-height:1.14;letter-spacing:-1.5px;margin:0 0 9px;font-weight:750}.intro{font-size:18px;color:var(--muted);line-height:1.5;margin:0}.steps{display:flex;align-items:center;justify-content:space-between;margin:34px 0 45px;gap:12px}.steps button{border:0;background:none;color:var(--muted);padding:0;display:flex;align-items:center;gap:12px;font-size:14px;white-space:nowrap}.steps button span{display:grid;place-items:center;background:#eef1f4;border-radius:50%;width:38px;height:38px;color:#343c4a}.steps button[aria-current="step"]{color:#171a27;font-weight:650}.steps button[aria-current="step"] span{background:var(--yellow)}.step-line{height:1px;flex:1;background:var(--border);min-width:8px}h2{font-size:24px;letter-spacing:-.6px;margin:0 0 8px}.section-description{color:var(--muted);font-size:15px;line-height:1.5;margin:0 0 25px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:22px}.field{display:flex;flex-direction:column;gap:8px;min-width:0;font-size:14px;font-weight:600}.wide{grid-column:1/-1}input:not([type=checkbox]):not([type=color]),textarea,select{width:100%;padding:12px 14px;color:#344054;border:1px solid var(--border);border-radius:6px;background:#fff;min-height:44px;outline:none}input:focus,textarea:focus,select:focus{border-color:#b09800;box-shadow:0 0 0 3px #ffd10020}input::placeholder,textarea::placeholder{color:#96a0af;font-weight:400}textarea{resize:vertical;min-height:78px;line-height:1.5}.hint{font-weight:400;color:var(--muted);font-size:12px;line-height:1.6}.flow-actions{border-top:1px solid #e5e8ed;display:flex;justify-content:space-between;padding-top:18px;margin-top:26px}.privacy{display:flex;gap:10px;align-items:center;color:var(--muted);font-size:12px;margin-top:20px}.privacy svg{width:15px;height:15px}.preview-region{background:#f2f5f7;padding:44px 3.7vw 30px}.preview-toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:36px;color:var(--muted);font-size:12px;font-weight:600;letter-spacing:.6px}.view-controls{display:flex;gap:5px}.view-controls button{background:transparent;border:0;border-radius:7px;padding:9px 12px;color:var(--muted);font-size:12px}.view-controls button[aria-pressed=true]{background:#e5eaef;color:#1d2634}.contact-card{width:100%;max-width:396px;margin:auto;border-radius:12px;overflow:hidden;background:white;color:#202430;box-shadow:0 18px 38px #24314616}.card-banner{height:175px;background:#242629;display:flex;align-items:center;justify-content:center;color:var(--accent);font-size:24px;font-weight:600}.card-banner img{max-width:65%;max-height:90px;object-fit:contain}.card-body{padding:0 33px 20px;text-align:center}.avatar{width:100px;height:100px;border:4px solid white;border-radius:50%;background:#e6ebef;position:relative;margin:-42px auto 15px;display:grid;place-items:center;font-size:32px;font-weight:650;overflow:hidden;color:#242629}.avatar img{width:100%;height:100%;object-fit:cover}.contact-card h2{font-size:27px;margin-bottom:4px;overflow-wrap:anywhere}.contact-card p{margin:4px 0;color:#566377;font-size:17px;line-height:1.5;overflow-wrap:anywhere}.contact-card .company{color:#7c889a;font-size:16px}.save-contact{display:flex;justify-content:center;align-items:center;gap:12px;padding:14px 16px;background:var(--accent);color:var(--ink);font-weight:650;text-decoration:none;border-radius:7px;margin:22px 0 24px;font-size:16px}.save-contact svg{width:24px;height:24px}.contact-links{border-top:1px solid #e4e8ed;padding:17px 0;display:grid;gap:19px;text-align:left}.contact-links:empty{display:none}.contact-links a{display:flex;align-items:center;gap:18px;text-decoration:none;font-size:14px;line-height:1.5;color:#4e5b6f;overflow-wrap:anywhere;min-width:0}.contact-links a span{min-width:0}.contact-links a:hover{text-decoration:underline}.contact-card .bio{border-top:1px solid #e4e8ed;padding-top:22px;font-size:13px;color:#68758a;white-space:pre-wrap}.contact-card.dark{background:#242629;color:white}.dark .card-banner{background:#141619}.dark .avatar{border-color:#242629}.dark .contact-links a,.dark p{color:#d0d7e0}.dark .company,.dark .bio{color:#b8c2cf}.dark .bio,.dark .contact-links{border-color:#454951}.preview-note{font-size:12px;color:var(--muted);text-align:center;line-height:1.6;max-width:365px;margin:20px auto}.upload{border:1px dashed #c1cad6;border-radius:8px;padding:20px;background:#fafbfc}.upload input{padding:8px 0!important;border:0!important;background:none!important;font-size:12px}.upload img{height:65px;max-width:130px;object-fit:contain;margin:5px 0}.text-button{border:0;background:none;color:#536278;text-decoration:underline;padding:5px 0;font-size:12px;width:fit-content}.color-row{display:flex;align-items:center;gap:14px}.color-row input{height:44px;width:64px;border:1px solid var(--border);background:white;border-radius:6px;padding:4px}.checkbox{display:flex;align-items:center;gap:10px;line-height:1.6;font-size:14px}.checkbox input{accent-color:#b29600;width:18px;height:18px}.qr-poster{max-width:396px;margin:auto;background:#222;border-radius:24px;padding:20px;text-align:center;color:#fff}.qr-poster svg{width:100%;height:auto;display:block;border-radius:12px}.qr-poster h2{margin:25px 0 12px;font-size:29px;overflow-wrap:anywhere}.export-list{display:grid;gap:12px}.export-row{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:17px 0;border-bottom:1px solid #e5e8ed}.export-row strong{font-size:15px}.export-row p{margin:5px 0 0;font-size:13px;color:var(--muted);line-height:1.5}.export-row button{flex-shrink:0;padding:10px 15px}details{margin-top:25px;border:1px solid var(--border);border-radius:8px;padding:16px;font-size:14px;line-height:1.8}summary{cursor:pointer;font-weight:600}details ol{padding-left:22px}code{font-size:12px;overflow-wrap:anywhere}.draft-tools{display:flex;gap:20px;margin-top:18px}.draft-tools label{cursor:pointer}.draft-tools input{max-width:210px}#error{color:#a22e24;font-size:14px;line-height:1.5}#error:empty{display:none}#toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#20252d;color:white;padding:12px 20px;border-radius:8px;font-size:14px;z-index:10;box-shadow:0 5px 25px #0002;max-width:90vw}#toast:empty{display:none}dialog{border:1px solid var(--border);border-radius:14px;padding:30px;max-width:460px}dialog::backdrop{background:#16202d66}dialog p{color:var(--muted);line-height:1.6}.dialog-actions{display:flex;gap:12px;margin-top:25px}.standalone{background:#f2f5f7;min-height:100vh;padding:50px 20px}.standalone .contact-card{max-width:430px}.standalone .qr-poster{margin-top:25px;max-width:320px}@media(min-width:1500px){.editor{padding-top:48px}.form-grid{gap:24px}.steps{margin-top:36px}}@media(max-width:1100px){.editor{padding:32px 30px}.preview-region{padding:32px 25px}.steps{gap:8px}.steps button{gap:7px;font-size:12px}.steps button span{width:30px;height:30px}.intro{font-size:16px}.card-body{padding-left:24px;padding-right:24px}}@media(max-width:780px){.workspace{grid-template-columns:1fr}.editor{padding:30px 22px 22px}.preview-region{padding:26px 22px 40px}.app-header{padding:0 22px}.brand{font-size:19px;gap:10px}.app-header button{padding:10px 15px;min-height:40px}h1{font-size:32px;letter-spacing:-1px}.steps{margin:28px 0 32px}.preview-toolbar{max-width:396px;margin:0 auto 25px}.form-grid{gap:18px}.intro{max-width:520px}.preview-region{border-top:1px solid #e4e8ed}}@media(max-width:420px){.form-grid{grid-template-columns:1fr}.steps button{flex-direction:column;gap:7px;font-size:11px}.step-line{margin-bottom:20px}.steps{gap:9px}h1{font-size:29px}.export-row{align-items:flex-start}.export-row button{font-size:12px}.card-body{padding-left:22px;padding-right:22px}.draft-tools{flex-direction:column;gap:8px}}@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

.color-row input[type="color"]{flex:0 0 64px}.color-row #accent-hex{min-width:0;width:100%;height:44px;padding:10px 12px;font-family:ui-monospace,Consolas,monospace}.color-row #accent-hex[aria-invalid="true"]{border-color:#a22e24}

.qr-artwork{width:100%;max-width:396px;margin:auto}.qr-artwork>svg{display:block;width:100%;height:auto}

.qr-artwork>img{display:block;width:100%;height:auto;max-width:100%;object-fit:contain}

[hidden]{display:none!important}.publish-dialog{width:calc(100% - 32px);max-width:620px;max-height:90vh;overflow:auto}.publish-dialog input{min-width:0}.publish-dialog p{overflow-wrap:anywhere}.publish-offer{margin-top:25px;padding:18px 0}.publish-dialog #publish-status{font-size:14px;color:#344054}.publish-dialog .dialog-actions{justify-content:space-between}

.url-prefix{display:block;padding:12px;background:#f2f5f7;border-radius:6px;overflow-wrap:anywhere;font-size:14px}input[readonly]{background:#f2f5f7!important;color:#536174!important}
