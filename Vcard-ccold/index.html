ackground:#242629;display:flex;align-items:center;justify-content:center;color:var(--accent);font-size:24px;font-weight:600}.card-banner img{max-width:65%;max-height:90px;object-fit:contain}.card-body{padding:0 33px 20px;text-align:center}.avatar{width:100px;height:100px;border:4px solid white;border-radius:50%;background:#e6ebef;position:relative;margin:-42px auto 15px;display:grid;place-items:center;font-size:32px;font-weight:650;overflow:hidden;color:#242629}.avatar img{width:100%;height:100%;object-fit:cover}.contact-card h2{font-size:27px;margin-bottom:4px;overflow-wrap:anywhere}.contact-card p{margin:4px 0;color:#566377;font-size:17px;line-height:1.5;overflow-wrap:anywhere}.contact-card .company{color:#7c889a;font-size:16px}.save-contact{display:flex;justify-content:center;align-items:center;gap:12px;padding:14px 16px;background:var(--accent);color:var(--ink);font-weight:650;text-decoration:none;border-radius:7px;margin:22px 0 24px;font-size:16px}.save-contact svg{width:24px;height:24px}.contact-links{border-top:1px solid #e4e8ed;padding:17px 0;display:grid;gap:19px;text-align:left}.contact-links:empty{display:none}.contact-links a{display:flex;align-items:center;gap:18px;text-decoration:none;font-size:14px;line-height:1.5;color:#4e5b6f;overflow-wrap:anywhere;min-width:0}.contact-links a span{min-width:0}.contact-links a:hover{text-decoration:underline}.contact-card .bio{border-top:1px solid #e4e8ed;padding-top:22px;font-size:13px;color:#68758a;white-space:pre-wrap}.contact-card.dark{background:#242629;color:white}.dark .card-banner{background:#141619}.dark .avatar{border-color:#242629}.dark .contact-links a,.dark p{color:#d0d7e0}.dark .company,.dark .bio{color:#b8c2cf}.dark .bio,.dark .contact-links{border-color:#454951}.preview-note{font-size:12px;color:var(--muted);text-align:center;line-height:1.6;max-width:365px;margin:20px auto}.upload{border:1px dashed #c1cad6;border-radius:8px;padding:20px;background:#fafbfc}.upload input{padding:8px 0!important;border
